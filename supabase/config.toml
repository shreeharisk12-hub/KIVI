project_id = "kivi-local"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
major_version = 17
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/", "http://127.0.0.1:5173/auth**", "http://127.0.0.1:5173/reset-password", "http://localhost:5173/", "http://localhost:5173/auth**", "http://localhost:5173/reset-password"]
[auth.email]
enable_signup = true
enable_confirmations = true
[functions.shopping-assistant]
# Identity is validated explicitly with Auth.getUser inside the handler.
verify_jwt = false
